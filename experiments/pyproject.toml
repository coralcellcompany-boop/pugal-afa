[project]
name = "experiment"
version = "0.1.0"
description = "Experiments for this paper. Independent uv project so the code can be released with the paper."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "pandas>=3.1.0",
    "scipy>=1.17.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
